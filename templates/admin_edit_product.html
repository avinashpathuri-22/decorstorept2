{% extends 'admin_base.html' %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
    <h2>Edit Product: {{ product.name }}</h2>
    <a href="{{ url_for('admin_products') }}" class="btn btn-outline">&larr; Back to Products</a>
</div>

<div class="card" style="max-width: 800px; margin: 0 auto;">
    <form action="{{ url_for('admin_edit_product', product_id=product.id) }}" method="POST" enctype="multipart/form-data">
        <div style="margin-bottom: 1rem;">
            <label for="name" style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Product Name *</label>
            <input type="text" id="name" name="name" value="{{ product.name }}" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 1rem;">
            <label for="description" style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Description *</label>
            <textarea id="description" name="description" rows="4" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; resize: vertical;">{{ product.description }}</textarea>
        </div>

        <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
            <div style="flex: 1;">
                <label for="price" style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Price (₹) *</label>
                <input type="number" id="price" name="price" value="{{ product.price }}" step="0.01" min="0" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
            <div style="flex: 1;">
                <label for="stock" style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Current Stock *</label>
                <input type="number" id="stock" name="stock" value="{{ product.stock }}" min="0" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
        </div>

        <div style="margin-bottom: 1rem;">
            <label for="category" style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Category</label>
            <input type="text" id="category" name="category" value="{{ product.category or '' }}" style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 2rem;">
            <label style="display: block; font-weight: bold; margin-bottom: 0.5rem;">Product Image</label>
            <div style="padding: 1rem; border: 1px dashed #ccc; border-radius: 4px; background: #fafafa; display: flex; gap: 1rem; align-items: flex-start;">
                <div style="flex-shrink: 0;">
                    <p style="margin-top: 0; font-size: 0.9rem; color: #666;">Current Image:</p>
                    <img src="{{ get_image_url(product.image_url) }}" alt="{{ product.name }}" style="width: 100px; height: 100px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd;">
                </div>
                <div style="flex-grow: 1;">
                    <div style="margin-bottom: 1rem;">
                        <label for="image" style="display: block; margin-bottom: 0.25rem;">Upload New Image File (Optional):</label>
                        <input type="file" id="image" name="image" accept="image/*">
                    </div>
                    <div style="text-align: center; color: #666; margin: 0.5rem 0;">OR</div>
                    <div>
                        <label for="image_url" style="display: block; margin-bottom: 0.25rem;">Provide New Image URL (Optional):</label>
                        <input type="url" id="image_url" name="image_url" placeholder="Leave blank to keep current image" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
                    </div>
                    <small style="color: #666; display: block; margin-top: 0.5rem;">If you don't upload a new file or provide a new URL, the current image will be kept.</small>
                </div>
            </div>
        </div>

        <div style="text-align: right;">
            <a href="{{ url_for('admin_products') }}" class="btn btn-outline" style="margin-right: 0.5rem;">Cancel</a>
            <button type="submit" class="btn btn-primary" style="padding: 0.75rem 2rem; font-size: 1rem;">Update Product</button>
        </div>
    </form>
</div>
{% endblock %}
